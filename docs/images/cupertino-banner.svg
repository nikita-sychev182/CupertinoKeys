<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Cupertino Keys</title>
  <desc id="desc">iOS-inspired keyboard for Android. Local dictionaries. Russian and English. Early preview.</desc>
  <defs>
    <linearGradient id="surface" x2="1" y2="1">
      <stop stop-color="#292c33"/>
      <stop offset="1" stop-color="#14161a"/>
    </linearGradient>
    <linearGradient id="key" x2="0" y2="1">
      <stop stop-color="#676a72"/>
      <stop offset="1" stop-color="#45474e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#8296a9" stop-opacity=".23"/>
      <stop offset="1" stop-color="#8296a9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#surface)"/>
  <ellipse cx="940" cy="160" rx="330" ry="260" fill="url(#glow)"/>
  <g font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="56" y="76" fill="#b6c8d9" font-size="14" font-weight="600" letter-spacing="3">ANDROID · OPEN SOURCE</text>
    <text x="52" y="158" fill="#f7f8fa" font-size="64" font-weight="650" letter-spacing="-2">Cupertino Keys</text>
    <text x="56" y="207" fill="#bcc0c9" font-size="23">Familiar feel. Your words stay local.</text>
    <g font-size="14" fill="#dce1e7" text-anchor="middle">
      <rect x="56" y="258" width="84" height="32" rx="16" fill="#383c44"/>
      <text x="98" y="279">RU / EN</text>
      <rect x="152" y="258" width="116" height="32" rx="16" fill="#383c44"/>
      <text x="210" y="279">Local dictionary</text>
      <rect x="280" y="258" width="126" height="32" rx="16" fill="#383c44"/>
      <text x="343" y="279">0.1.1 · Preview</text>
    </g>
    <g transform="translate(788 68)">
      <rect width="356" height="224" rx="25" fill="#b9c1cf" fill-opacity=".09" stroke="#d1d9e5" stroke-opacity=".16"/>
      <g fill="url(#key)" stroke="#e2e6ed" stroke-opacity=".11">
        <rect x="20" y="24" width="96" height="78" rx="12"/>
        <rect x="130" y="24" width="96" height="78" rx="12"/>
        <rect x="240" y="24" width="96" height="78" rx="12"/>
        <rect x="20" y="116" width="206" height="78" rx="12"/>
        <rect x="240" y="116" width="96" height="78" rx="12"/>
      </g>
      <g fill="#f5f6f8" text-anchor="middle" font-size="35">
        <text x="68" y="76">C</text>
        <text x="178" y="76">K</text>
        <text x="288" y="76">⌫</text>
        <text x="123" y="163" font-size="17" fill="#e0e3e9">space</text>
        <text x="288" y="165">,</text>
      </g>
    </g>
  </g>
</svg>
