name: Cupertino Keys

on:
  push:
    branches: [cupertino]
  pull_request:
    branches: [cupertino]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cupertino-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify privacy policy in source
        run: python3 tools/check_privacy.py
      - name: Install upstream SDK and NDK
        run: sdkmanager 'platforms;android-37.0' 'ndk;28.0.13004108'
      - name: Test private dictionary and language defaults
        run: bash gradlew :app:testDebugUnitTest --tests '*LocalDictionaryProviderTest' --tests '*CupertinoDefaultsTest' --tests '*InputPrivacyTest' --tests '*CupertinoBlurBackgroundTest' --stacktrace
      - name: Build development APK
        run: bash gradlew :app:assembleDebugNoMinify --stacktrace
      - name: Check final merged manifest
        run: python3 tools/check_privacy.py --merged
      - uses: actions/upload-artifact@v4
        with:
          name: CupertinoKeys-0.1.0-dev
          path: app/build/intermediates/apk/debugNoMinify/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cupertino-reports
          path: app/build/reports/
